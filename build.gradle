plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}
ext {
    set('logback.version', '1.6.3')
    set('jackson-bom.version', '3.2.3')
    set('jackson-2-bom.version', '2.22.3')
    set('tomcat.version', '11.0.26')
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'ClauseClear'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'com.google.genai:google-genai:1.78.0'
    implementation platform('com.fasterxml.jackson:jackson-bom:2.22.3')
    implementation 'org.ow2.asm:asm:9.11'
}

configurations.configureEach {
    resolutionStrategy {
        force 'com.fasterxml.jackson.core:jackson-core:2.22.3'
        force 'com.fasterxml.jackson.core:jackson-databind:2.22.3'
        force 'com.fasterxml.jackson.datatype:jackson-datatype-jdk8:2.22.3'
        force 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.22.3'
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
